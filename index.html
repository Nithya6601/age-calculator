<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Age Calculator</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="theme-toggle">
    <button id="theme-toggle" title="Toggle Theme">🌙</button>
  </div>
  <div class="container">
    <div class="calculator">
      <h1><span>Age Calculator</span></h1>
      <div class="input-box">
        <input
          type="date"
          id="dob"
          inputmode="numeric"
          pattern="\d{4}-\d{2}-\d{2}"
          placeholder="yyyy-mm-dd"
        />
        <span class="error-message" id="error-message"></span>
        <button onclick="calculateAge()">Calculate</button>
        <button onclick="reset()">Reset</button>
      </div>
      <p id="result"></p>
      <p id="extraResult"></p>
    </div>
  </div>

  <script>
    const userInput = document.getElementById("dob");
    const result = document.getElementById("result");
    const extraResult = document.getElementById("extraResult");
    const themeToggle = document.getElementById("theme-toggle");
    const body = document.body;
    const errorMessage = document.getElementById("error-message");

    userInput.max = new Date().toISOString().split("T")[0];

    function calculateAge() {
      if (!userInput.value) {
        errorMessage.textContent = "Please enter a valid date.";
        return;
      }

      errorMessage.textContent = "";

      const birthDate = new Date(userInput.value);
      const today = new Date();
      let d1 = birthDate.getDate();
      let m1 = birthDate.getMonth() + 1;
      let y1 = birthDate.getFullYear();
      let d2 = today.getDate();
      let m2 = today.getMonth() + 1;
      let y2 = today.getFullYear();

      let d3, m3, y3;
      y3 = y2 - y1;

      if (m2 >= m1) {
        m3 = m2 - m1;
      } else {
        y3--;
        m3 = 12 + m2 - m1;
      }

      if (d2 >= d1) {
        d3 = d2 - d1;
      } else {
        m3--;
        d3 = getDaysInMonth(y2, m2 - 1) + d2 - d1;
      }

      if (m3 < 0) {
        m3 = 11;
        y3--;
      }

      const totalDays = Math.floor((today - birthDate) / (1000 * 60 * 60 * 24));
      const totalHours = totalDays * 24;

      result.innerHTML = `You are <span>${y3}</span> years, <span>${m3}</span> months and <span>${d3}</span> days old.`;
      extraResult.innerHTML = `Total Days: <span>${totalDays}</span>, Total Hours: <span>${totalHours}</span>`;
    }

    function getDaysInMonth(year, month) {
      return new Date(year, month + 1, 0).getDate();
    }

    function reset() {
      userInput.value = "";
      result.innerHTML = "";
      extraResult.innerHTML = "";
      errorMessage.textContent = "";
    }

    themeToggle.addEventListener("click", () => {
      body.classList.toggle("dark");
      themeToggle.classList.toggle("rotate");
      themeToggle.textContent = body.classList.contains("dark") ? "☀️" : "🌙";
    });

    userInput.addEventListener("keydown", (event) => {
      if (event.key === "Enter") {
        calculateAge();
      }
    });
  </script>
</body>
</html>
