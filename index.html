<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Age Calculator</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body class="light-mode">
  <!-- Dark Mode Toggle -->
  <div class="mode-toggle">
    <label class="switch">
      <input type="checkbox" id="themeToggle" />
      <span class="slider round"></span>
    </label>
    <span>Dark Mode</span>
  </div>

  <div class="container">
    <div class="calculator fade-in">
      <h1>Age <span>Calculator</span></h1>
      <div class="input-box">
        <input type="date" id="date" inputmode="numeric"
        pattern="\d{4}-\d{2}-\d{2}"
        placeholder="yyyy-mm-dd" />
        <button onclick="calculateAge()">Calculate</button>
        <button class="reset" onclick="resetForm()">Reset</button>
      </div>
      <p id="result"></p>
      <p id="extraResult"></p>
    </div>
  </div>

  <script>
    const userInput = document.getElementById("date");
    const result = document.getElementById("result");
    const extraResult = document.getElementById("extraResult");
    const toggle = document.getElementById("themeToggle");

    userInput.max = new Date().toISOString().split("T")[0];

    function calculateAge() {
      const birthDate = new Date(userInput.value);
      const today = new Date();

      let d1 = birthDate.getDate();
      let m1 = birthDate.getMonth() + 1;
      let y1 = birthDate.getFullYear();

      let d2 = today.getDate();
      let m2 = today.getMonth() + 1;
      let y2 = today.getFullYear();

      let d3, m3, y3;
      y3 = y2 - y1;

      if (m2 >= m1) {
        m3 = m2 - m1;
      } else {
        y3--;
        m3 = 12 + m2 - m1;
      }

      if (d2 >= d1) {
        d3 = d2 - d1;
      } else {
        m3--;
        d3 = new Date(y2, m2 - 1, 0).getDate() + d2 - d1;
      }

      if (m3 < 0) {
        m3 = 11;
        y3--;
      }

      const diffTime = today - birthDate;
      const totalDays = Math.floor(diffTime / (1000 * 60 * 60 * 24));
      const totalHours = Math.floor(diffTime / (1000 * 60 * 60));

      result.innerHTML = `You are <span>${y3}</span> years, <span>${m3}</span> months, and <span>${d3}</span> days old.`;
      extraResult.innerHTML = `That's a total of <span>${totalDays}</span> days or <span>${totalHours}</span> hours.`;
    }

    function resetForm() {
      userInput.value = "";
      result.innerHTML = "";
      extraResult.innerHTML = "";
    }

    // Theme Toggle
    toggle.addEventListener("change", () => {
      document.body.classList.toggle("dark-mode");
      document.body.classList.toggle("light-mode");
    });
  </script>
</body>
</html>
